# Ручные формы склонения ФИО (T035).
#
# «Бивень» — фамилия-нарицательное: движок по умолчанию оставляет такие
# в именительном падеже, потому что в официальном документе безопаснее не
# склонять вовсе, чем склонить неверно. Здесь мы говорим Дьяку, как именно
# склонять этого человека.
#
# Ключ — ФИО целиком, как в таблице. Падежи: им/рд/дт/вн/тв/пр, можно
# указать не все — остальные возьмёт движок.
overrides:
  fio:
    "Бивень Абрам Моисеевич":
      рд: "Бивня Абрама Моисеевича"
      дт: "Бивню Абраму Моисеевичу"
      вн: "Бивня Абрама Моисеевича"
      тв: "Бивнем Абрамом Моисеевичем"
      пр: "Бивне Абраме Моисеевиче"
